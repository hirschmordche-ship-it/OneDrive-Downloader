<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneDrive Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LEFT DRAWER -->
  <aside id="drawer" class="drawer glass hidden">
    <div class="drawer-header">
      <div class="avatar-large">M</div>
      <div>
        <div class="drawer-name">Your Profile</div>
        <div class="drawer-sub">Multi-account OneDrive</div>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-item" id="drawerAccounts">Accounts</div>
      <div class="drawer-item" id="drawerSettings">Settings</div>
      <div class="drawer-item" id="drawerPrivacy">Privacy Policy</div>
    </div>
    <div class="drawer-section">
      <div class="drawer-item danger" id="drawerLogout">Logout</div>
    </div>
  </aside>

  <!-- THEME SHEET -->
  <div id="themeSheet" class="theme-sheet hidden glass">
    <div class="sheet-handle"></div>
    <h3>Themes</h3>
    <div class="theme-row" data-theme="default"><span>Default</span></div>
    <div class="theme-row" data-theme="blue"><span>Blue</span></div>
    <div class="theme-row" data-theme="purple"><span>Purple</span></div>
    <div class="theme-row" data-theme="green"><span>Green</span></div>
    <div class="theme-row" data-theme="sunset"><span>Sunset</span></div>
  </div>

  <!-- OVERLAY -->
  <div id="overlay" class="overlay hidden"></div>

  <!-- APP SHELL -->
  <div class="app-shell">

    <!-- TOP BAR -->
    <header class="topbar glass">
      <button id="menuBtn" class="icon-btn">☰</button>
      <div class="topbar-title">OneDrive</div>
      <div id="avatarBtn" class="avatar">M</div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main" class="main glass">
      <div class="section-header">
        <h2 id="sectionTitle">Browse</h2>
        <button id="themeBtn" class="chip">Theme</button>
      </div>

      <div id="sectionContent" class="section-content"></div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottombar glass">
      <button class="nav-btn active" data-section="browse">Browse</button>
      <button class="nav-btn" data-section="timeline">Timeline</button>
      <button class="nav-btn" data-section="analyzer">Analyzer</button>
      <button class="nav-btn" data-section="vault">Vault</button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>
</html>
